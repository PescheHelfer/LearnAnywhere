org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler stores source paths relative to the module, and
# on Windows a path cannot be relativized across drive letters. When the pub
# cache and this checkout sit on different drives, compiling a plugin's Kotlin
# sources fails with "this and base files have different roots" while closing
# the incremental caches. Disabling incremental compilation avoids that; the
# cost is negligible because this module has almost no Kotlin of its own.
kotlin.incremental=false
