name: learn_anywhere_desktop
description: Desktop shell for Learn Anywhere on Windows and Linux.
publish_to: 'none'
version: 0.6.1+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  learn_anywhere_core:
    path: ../core
  learn_anywhere_ui_kit:
    path: ../ui_kit
  path: ^1.9.0
  shared_preferences: ^2.3.2
  window_manager: ^0.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Only the sizes actually drawn by the UI are bundled. The 256 px
  # assets/icons/learn_anywhere.png next to this one is a packaging input for
  # the Linux AppImage, not a runtime asset, so the directory is deliberately
  # not listed as a whole.
  assets:
    - assets/icons/learn_anywhere_128.png
