name: learn_anywhere

packages:
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
    description: Analyze every package in the workspace.
  test:core:
    run: melos exec --scope=learn_anywhere_core -- dart test
    description: Run pure Dart core tests.
  format:
    run: dart format .
    description: Format the workspace.
